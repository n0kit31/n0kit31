<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Marcin Krzyżanowski — E-commerce, Linux &amp; DevOps</title>
  <desc id="desc">A terminal-inspired profile banner with Magento 2, MageOS + Hyvä, Shopify, and WooCommerce badges.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a24"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#49e2ac" stop-opacity=".14"/>
      <stop offset="1" stop-color="#49e2ac" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8da6b7" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="338" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="1040" cy="195" rx="280" ry="240" fill="url(#glow)"/>
    <path d="M0 53H1200" stroke="#25333f"/>

    <g aria-hidden="true">
      <circle cx="31" cy="27" r="5" fill="#fa7970"/>
      <circle cx="50" cy="27" r="5" fill="#eac15a"/>
      <circle cx="69" cy="27" r="5" fill="#49ce91"/>
    </g>
    <text x="96" y="32" fill="#8da6b7" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13">marcin@github: ~</text>
    <text x="1155" y="32" text-anchor="end" fill="#647e90" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12">zsh</text>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
      <text x="48" y="105" font-size="18"><tspan fill="#49e2ac">❯</tspan><tspan fill="#9fb3c2"> whoami</tspan></text>
      <text x="46" y="169" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">Marcin Krzyżanowski<tspan fill="#49e2ac">_</tspan></text>
      <text x="48" y="211" fill="#9fb3c2" font-size="19">E-commerce <tspan fill="#49e2ac">/</tspan> Linux <tspan fill="#49e2ac">/</tspan> DevOps</text>

      <g transform="translate(48 252)" font-size="15" text-anchor="middle">
        <rect width="118" height="32" rx="7" fill="#f26322" fill-opacity=".12" stroke="#f26322" stroke-opacity=".4"/>
        <text x="59" y="21" fill="#ffab83">Magento 2</text>
        <rect x="130" width="165" height="32" rx="7" fill="#49e2ac" fill-opacity=".09" stroke="#49e2ac" stroke-opacity=".35"/>
        <text x="212.5" y="21" fill="#7ee9c1">MageOS + Hyvä</text>
        <rect x="307" width="101" height="32" rx="7" fill="#95bf47" fill-opacity=".1" stroke="#95bf47" stroke-opacity=".4"/>
        <text x="357.5" y="21" fill="#badc81">Shopify</text>
        <rect x="420" width="146" height="32" rx="7" fill="#b18bef" fill-opacity=".1" stroke="#b18bef" stroke-opacity=".4"/>
        <text x="493" y="21" fill="#ceb1fa">WooCommerce</text>
      </g>
    </g>

    <g transform="translate(895 104)" aria-hidden="true">
      <g fill="none" stroke="#49e2ac" stroke-opacity=".25">
        <path d="M110 96L28 35M110 96L206 25M110 96L224 145M110 96L42 184"/>
        <circle cx="110" cy="96" r="57" stroke-dasharray="3 9"/>
        <circle cx="110" cy="96" r="84" stroke-opacity=".09"/>
      </g>
      <g fill="#102b29" stroke="#49e2ac" stroke-opacity=".5">
        <rect x="9" y="20" width="38" height="30" rx="6"/>
        <rect x="187" y="10" width="38" height="30" rx="6"/>
        <rect x="205" y="130" width="38" height="30" rx="6"/>
        <rect x="23" y="169" width="38" height="30" rx="6"/>
      </g>
      <g fill="#49e2ac">
        <circle cx="28" cy="35" r="3"/>
        <circle cx="206" cy="25" r="3"/>
        <circle cx="224" cy="145" r="3"/>
        <circle cx="42" cy="184" r="3"/>
      </g>
      <rect x="76" y="62" width="68" height="68" rx="16" fill="#102b29" stroke="#49e2ac" stroke-opacity=".65"/>
      <path d="M91 85L102 96L91 107M111 108H129" fill="none" stroke="#7ee9c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="none" stroke="#25333f"/>
</svg>
